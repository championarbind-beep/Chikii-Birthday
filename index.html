<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday My Love</title>

  <!-- Cute fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: radial-gradient(circle at top, #ffecd2 0%, #fcb69f 30%, #f5a9c0 60%, #7f5af0 100%);
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      color: #ffffff;
    }

    .wrapper {
      position: relative;
      width: 100%;
      max-width: 520px;
    }

    .glow-circle {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.35), transparent 60%);
      filter: blur(2px);
      animation: pulse 3.8s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(0.95);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.05);
        opacity: 1;
      }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(7, 2, 20, 0.85);
      border-radius: 24px;
      padding: 26px 22px 24px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .tag-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffb5e8;
      box-shadow: 0 0 8px #ffb5e8;
    }

    h1 {
      font-family: "Great Vibes", cursive;
      font-size: 42px;
      line-height: 1.1;
      margin-bottom: 4px;
      text-align: center;
      text-shadow: 0 0 14px rgba(255, 255, 255, 0.6);
      animation: glowTitle 3s ease-in-out infinite;
    }

    @keyframes glowTitle {
      0%, 100% {
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.6), 0 0 25px rgba(255, 170, 230, 0.9);
      }
      50% {
        text-shadow: 0 0 16px rgba(255, 255, 255, 1), 0 0 34px rgba(255, 190, 240, 1);
      }
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 16px;
    }

    .divider {
      width: 70%;
      height: 1px;
      margin: 8px auto 18px;
      background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.6), transparent);
    }

    .message-label {
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 6px;
    }

    #message {
      font-size: 14px;
      line-height: 1.7;
      max-height: 60vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    #message::-webkit-scrollbar {
      width: 4px;
    }

    #message::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.4);
      border-radius: 999px;
    }

    .footer {
      margin-top: 18px;
      font-size: 12px;
      opacity: 0.7;
      text-align: center;
    }

    .footer span {
      opacity: 0.9;
      font-weight: 500;
    }

    .heart {
      position: fixed;
      bottom: -40px;
      width: 18px;
      height: 18px;
      background: rgba(255, 255, 255, 0.9);
      transform: rotate(45deg);
      animation: floatUp 12s linear infinite;
      z-index: 0;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      background: inherit;
      border-radius: 50%;
    }

    .heart::before {
      top: -9px;
      left: 0;
    }

    .heart::after {
      left: -9px;
      top: 0;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.9) rotate(45deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) scale(1.4) rotate(45deg);
        opacity: 0;
      }
    }

    .heart:nth-child(1) { left: 5%; animation-duration: 13s; animation-delay: 0s; }
    .heart:nth-child(2) { left: 18%; animation-duration: 11s; animation-delay: -4s; }
    .heart:nth-child(3) { left: 32%; animation-duration: 15s; animation-delay: -7s; }
    .heart:nth-child(4) { left: 48%; animation-duration: 12s; animation-delay: -2s; }
    .heart:nth-child(5) { left: 64%; animation-duration: 14s; animation-delay: -6s; }
    .heart:nth-child(6) { left: 78%; animation-duration: 10s; animation-delay: -3s; }
    .heart:nth-child(7) { left: 90%; animation-duration: 16s; animation-delay: -9s; }

    @media (max-width: 480px) {
      h1 {
        font-size: 34px;
      }
      .card {
        padding: 22px 18px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Floating hearts -->
  <div class="heart"></div>
  <div class="heart"></div>
  <div class="heart"></div>
  <div class="heart"></div>
  <div class="heart"></div>
  <div class="heart"></div>
  <div class="heart"></div>

  <div class="wrapper">
    <div class="glow-circle"></div>

    <div class="card">
      <div class="tag">
        <span class="tag-dot"></span>
        <span>For my birthday girl, Chikii 🎂</span>
      </div>

      <h1>Happy Birthday My Love</h1>
      <p class="subtitle">
        Even from miles away, today my heart is standing next to you.
      </p>

      <div class="divider"></div>

      <p class="message-label">a little note from my heart</p>
      <div id="message"></div>

      <p class="footer">
        Made with <span>infinite love</span> and a tiny bit of HTML 💌
      </p>
    </div>
  </div>

  <script>
    const messageText = `Hi my little universe, my Chikii,

Happy Birthday, love. Even though there are miles between us today, my whole world is standing right where you are.

Thank you for being the softest part of my days, the loudest reason I smile, and the one person who makes distance feel small.

On your birthday I wish you all the happiness, calm hugs after long days, and every tiny dream you're too shy to say out loud. One day I’ll say all of this to you in person, holding your hand instead of my phone.

Until then, close your eyes for a second and pretend my arms are around you.

I love you more than these words on the screen can ever say.

— Yours, Chiku`;

    const messageEl = document.getElementById("message");
    let i = 0;

    function typeLetter() {
      if (i < messageText.length) {
        const char = messageText.charAt(i);

        if (char === "\n") {
          messageEl.innerHTML += "<br>";
        } else {
          messageEl.innerHTML += char;
        }

        i++;
        setTimeout(typeLetter, 35);
      }
    }

    window.addEventListener("load", function () {
      setTimeout(typeLetter, 800);
    });
  </script>

  <!-- 🎵 Hidden Spotify Music -->
  <iframe 
    src="https://open.spotify.com/embed/track/0q84FggW57NXGtLHoetS0Y" 
    width="0" height="0"
    frameborder="0"
    allow="encrypted-media; autoplay"
    loading="lazy">
  </iframe>

</body>

</html>
